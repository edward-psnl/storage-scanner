<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan item QR code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame { position: fixed; top: 50%; left: 50%; width: min(70vw, 320px); aspect-ratio: 1; transform: translate(-50%, -55%);
           border: 3px solid rgba(255,255,255,.9); border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); pointer-events: none; }
  .msg { position: fixed; left: 16px; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); text-align: center;
         font-size: 17px; font-weight: 600; padding: 14px; border-radius: 12px; background: rgba(0,0,0,.65); }
  .msg.err { background: rgba(185,28,28,.9); }
  .msg.ok { background: rgba(22,163,74,.92); }
  button { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; padding: 10px 16px; font-size: 16px; font-weight: 700;
           border: 0; border-radius: 10px; background: rgba(255,255,255,.9); color: #111; }
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<div class="frame"></div>
<button id="cancel" type="button">Cancel</button>
<div class="msg" id="msg">Starting camera...</div>

<script>
  const $ = id => document.getElementById(id);
  let stream = null, done = false, detector = null;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  function say(t, cls) { $('msg').textContent = t; $('msg').className = 'msg ' + (cls || ''); }
  function stop() { done = true; if (stream) stream.getTracks().forEach(t => t.stop()); }

  async function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say('This browser cannot open the camera here. Use Chrome or Safari over https.', 'err'); return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    } catch (e) {
      say(e.name === 'NotAllowedError' ? 'Camera permission was denied. Allow camera access for this site, then reopen the scanner.'
                                       : 'Could not start the camera: ' + e.message, 'err');
      return;
    }
    const v = $('v');
    v.srcObject = stream;
    try { await v.play(); } catch (e) {}
    if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; } }
    say('Point the camera at the item QR code');
    loop();
  }

  async function loop() {
    if (done) return;
    const v = $('v');
    if (v.readyState >= 2 && v.videoWidth) {
      let text = '';
      try {
        if (detector) {
          const r = await detector.detect(v);
          if (r.length) text = r[0].rawValue;
        } else if (window.jsQR) {
          const s = Math.min(1, 800 / v.videoWidth);
          canvas.width = Math.round(v.videoWidth * s); canvas.height = Math.round(v.videoHeight * s);
          ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
          const r = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height, { inversionAttempts: 'dontInvert' });
          if (r && r.data) text = r.data;
        }
      } catch (e) { detector = null; }          // if the built-in reader misbehaves, fall back to jsQR
      if (text) { finish(text); return; }
    }
    setTimeout(() => requestAnimationFrame(loop), 70);   // about 12 reads per second
  }

  function finish(text) {
    stop();
    if (navigator.vibrate) navigator.vibrate(60);
    // Normal path: hand the result back to the app tab that opened this page, then close.
    if (window.opener && !window.opener.closed) {
      try {
        window.opener.postMessage({ type: 'sr-scan', text: String(text) }, '*');
        say('Got it. Returning to the app...', 'ok');
        setTimeout(() => { window.close(); say('Scan complete. Close this tab to return to the app.', 'ok'); }, 350);
        return;
      } catch (e) {}
    }
    // No link back to the app tab: if the code is a Storage Room link, just open it.
    if (/^https:\/\/script\.google\.com\//i.test(text)) { say('Opening the item...', 'ok'); location.href = text; }
    else say('Scanned: ' + text + '. Return to the app and search for it.', 'err');
  }

  $('cancel').onclick = () => { stop(); window.close(); say('Cancelled. Close this tab to return to the app.'); };
  start();
</script>
</body>
</html>
