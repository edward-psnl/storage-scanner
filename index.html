<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan item QR code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame { position: fixed; top: 42%; left: 50%; width: min(86vw, 420px); aspect-ratio: 1; transform: translate(-50%, -50%);
           border: 3px solid rgba(255,255,255,.9); border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.4); pointer-events: none; }
  .top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
         padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 0; pointer-events: none; }
  .diag { font-size: 11px; opacity: .8; background: rgba(0,0,0,.5); padding: 4px 8px; border-radius: 8px; }
  button { font-family: inherit; font-size: 16px; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 16px; background: rgba(255,255,255,.92); color: #111; }
  .top button { pointer-events: auto; }
  .bottom { position: fixed; left: 14px; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 10px; }
  .row button { flex: 1; }
  .msg { text-align: center; font-size: 16px; font-weight: 600; padding: 12px; border-radius: 12px; background: rgba(0,0,0,.7); }
  .msg.err { background: rgba(185,28,28,.92); }
  .msg.ok { background: rgba(22,163,74,.94); }
  #zoomWrap { display: none; align-items: center; gap: 10px; background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 12px; font-size: 13px; }
  #zoom { flex: 1; }
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<div class="frame"></div>
<div class="top"><div class="diag" id="diag">Starting...</div><button id="cancel" type="button">Cancel</button></div>
<div class="bottom">
  <div id="zoomWrap"><span>Zoom</span><input id="zoom" type="range"></div>
  <div class="msg" id="msg">Starting camera...</div>
  <div class="row">
    <button id="shot" type="button">📸 Capture</button>
    <button id="photo" type="button">🖼 Take photo</button>
  </div>
</div>
<input id="file" type="file" accept="image/*" capture="environment" style="display:none">

<script>
  const $ = id => document.getElementById(id);
  const sleep = () => new Promise(r => setTimeout(r, 0));
  let stream = null, track = null, done = false, detector = null, frames = 0, rot = 0;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  // [largest side in pixels, optional crop as fractions of the picture: x, y, width, height]
  // Dense codes (long links) need many pixels per square, so live scanning rotates through zoomed-in views of the middle.
  const LIVE = [[1100, null], [1400, [.2, .2, .6, .6]], [1600, null], [1400, [.1, .1, .8, .8]]];
  const STILL = [[2400, null], [1600, null], [1100, null], [2400, [.2, .2, .6, .6]], [1600, [.1, .1, .8, .8]], [2400, [.35, .15, .65, .7]]];

  function say(t, cls) { $('msg').textContent = t; $('msg').className = 'msg ' + (cls || ''); }
  function stop() { done = true; if (stream) stream.getTracks().forEach(t => t.stop()); }
  function size(src) { return src.videoWidth ? [src.videoWidth, src.videoHeight] : [src.naturalWidth || src.width, src.naturalHeight || src.height]; }

  function jsqrPass(src, max, crop, inv) {
    const wh = size(src), W = wh[0], H = wh[1];
    const sx = crop ? W * crop[0] : 0, sy = crop ? H * crop[1] : 0, cw = crop ? W * crop[2] : W, ch = crop ? H * crop[3] : H;
    const s = Math.min(1, max / Math.max(cw, ch)), w = Math.max(1, Math.round(cw * s)), h = Math.max(1, Math.round(ch * s));
    canvas.width = w; canvas.height = h;
    ctx.drawImage(src, sx, sy, cw, ch, 0, 0, w, h);
    const r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: inv });
    return r && r.data ? r.data : '';
  }

  function loadScript(src) {
    return new Promise((res, rej) => { const t = document.createElement('script'); t.src = src; t.onload = res; t.onerror = () => rej(new Error('blocked')); document.head.appendChild(t); });
  }
  async function ensureJsQR() {            // two different hosts, in case one is blocked on your network
    if (window.jsQR) return true;
    const urls = ['https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js', 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'];
    for (const u of urls) { try { await loadScript(u); if (window.jsQR) return true; } catch (e) {} }
    return false;
  }

  function diag() {
    $('diag').textContent = (detector ? 'Built-in reader' : 'Backup reader') + (window.jsQR ? ' + jsQR' : ' (jsQR NOT loaded)') + ' | frames ' + frames;
  }

  async function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say('This browser cannot open the camera here. Use Chrome or Safari over https.', 'err'); return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    } catch (e) {
      say(e.name === 'NotAllowedError' ? 'Camera permission was denied. Allow camera access for this site, then reopen the scanner.'
                                       : 'Could not start the camera: ' + e.message, 'err');
      return;
    }
    const v = $('v');
    v.srcObject = stream;
    try { await v.play(); } catch (e) {}
    track = stream.getVideoTracks()[0];
    try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
    try {                                                    // zoom slider on phones that support it
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.zoom) {
        const z = $('zoom'); z.min = caps.zoom.min; z.max = caps.zoom.max; z.step = caps.zoom.step || 0.1; z.value = caps.zoom.min;
        z.oninput = () => track.applyConstraints({ advanced: [{ zoom: Number(z.value) }] }).catch(() => {});
        $('zoomWrap').style.display = 'flex';
      }
    } catch (e) {}
    if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; } }
    say('Hold the code about a hand-span away and fill the box. Use Zoom if it will not read.');
    ensureJsQR().then(ok => { diag(); if (!ok && !detector) say('The QR reader could not load (blocked network?). Use "Take photo" instead.', 'err'); });
    diag();
    loop();
  }

  async function loop() {
    if (done) return;
    const v = $('v');
    if (v.readyState >= 2 && v.videoWidth) {
      frames++;
      let text = '';
      try { if (detector) { const r = await detector.detect(v); if (r.length) text = r[0].rawValue; } } catch (e) { detector = null; }
      if (!text && window.jsQR) {                           // always also try jsQR: the built-in reader can miss dense codes
        const p = LIVE[rot++ % LIVE.length];
        try { text = jsqrPass(v, p[0], p[1], 'dontInvert'); } catch (e) {}
      }
      if (frames % 15 === 0) diag();
      if (text) { finish(text); return; }
    }
    setTimeout(() => requestAnimationFrame(loop), 60);
  }

  // Strong, slower read of one still picture (a captured frame or a photo)
  async function decodeStill(src) {
    if ('BarcodeDetector' in window) {
      try { const r = await new BarcodeDetector({ formats: ['qr_code'] }).detect(src); if (r.length) return r[0].rawValue; } catch (e) {}
    }
    if (!(await ensureJsQR())) throw new Error('The QR reader could not load (blocked network?).');
    for (let i = 0; i < STILL.length; i++) {
      say('Reading... (' + (i + 1) + '/' + STILL.length + ')');
      await sleep();
      const t = jsqrPass(src, STILL[i][0], STILL[i][1], 'attemptBoth');
      if (t) return t;
    }
    return '';
  }

  const NOT_FOUND = 'No QR code found. Move closer so the code fills about a third of the screen, hold steady, avoid glare, and try again.';

  $('shot').onclick = async () => {
    const v = $('v');
    if (!v.videoWidth) { say('The camera is not ready yet.', 'err'); return; }
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    say('Reading the captured picture...');
    try { const t = await decodeStill(c); t ? finish(t) : say(NOT_FOUND, 'err'); } catch (e) { say(e.message, 'err'); }
  };

  $('photo').onclick = () => $('file').click();
  $('file').onchange = async () => {
    const f = $('file').files[0]; $('file').value = '';
    if (!f) return;
    const img = new Image();
    img.onload = async () => {
      say('Reading the photo...');
      try { const t = await decodeStill(img); URL.revokeObjectURL(img.src); t ? finish(t) : say(NOT_FOUND, 'err'); } catch (e) { say(e.message, 'err'); }
    };
    img.onerror = () => say('Could not open that photo.', 'err');
    img.src = URL.createObjectURL(f);
  };

  function finish(text) {
    stop();
    if (navigator.vibrate) navigator.vibrate(60);
    // Normal path: hand the result back to the app tab that opened this page, then close.
    if (window.opener && !window.opener.closed) {
      try {
        window.opener.postMessage({ type: 'sr-scan', text: String(text) }, '*');
        say('Got it. Returning to the app...', 'ok');
        setTimeout(() => { window.close(); say('Scan complete. Close this tab to return to the app.', 'ok'); }, 350);
        return;
      } catch (e) {}
    }
    // No link back to the app tab: if the code is a Storage Room link, just open it.
    if (String(text).toLowerCase().indexOf('https://script.google.com/') === 0) { say('Opening the item...', 'ok'); location.href = text; }
    else say('Scanned: ' + text + '. Return to the app and search for it.', 'err');
  }

  $('cancel').onclick = () => { stop(); window.close(); say('Cancelled. Close this tab to return to the app.'); };
  start();
</script>
</body>
</html>
